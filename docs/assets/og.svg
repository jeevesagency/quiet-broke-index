    <text x="294" y="506" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#7a766f">/ 100</text>
    <text x="98" y="540" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" fill="#1b1a17">New York, NY</text>
  
    <rect x="334" y="410" width="240" height="158" rx="8" fill="#fffdf8" stroke="#d9d2c6" stroke-width="1" />
    <text x="356" y="450" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#7a766f" letter-spacing="1.4">SCORE</text>
    <text x="356" y="506" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" fill="#1b1a17">56</text>
    <text x="552" y="506" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#7a766f">/ 100</text>
    <text x="356" y="540" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" fill="#1b1a17">Boston, MA</text>
  
    <rect x="592" y="410" width="240" height="158" rx="8" fill="#fffdf8" stroke="#d9d2c6" stroke-width="1" />
    <text x="614" y="450" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#7a766f" letter-spacing="1.4">SCORE</text>
    <text x="614" y="506" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" fill="#1b1a17">32</text>
    <text x="810" y="506" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#7a766f">/ 100</text>
    <text x="614" y="540" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" fill="#1b1a17">Atlanta, GA</text>
  
    <rect x="850" y="410" width="240" height="158" rx="8" fill="#fffdf8" stroke="#d9d2c6" stroke-width="1" />
    <text x="872" y="450" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#7a766f" letter-spacing="1.4">SCORE</text>
    <text x="872" y="506" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" fill="#1b1a17">22</text>
