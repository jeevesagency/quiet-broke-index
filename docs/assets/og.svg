<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#f7f4ee" />

  <!-- subtle border -->
  <rect x="0" y="0" width="1200" height="8" fill="#b3361f" />

  <!-- eyebrow -->
  <text x="76" y="92" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#7a766f" letter-spacing="2.2" font-weight="500">HENRY FINANCE RESEARCH · v0.1</text>

  <!-- headline: render as one tspan group so we get correct kerning between words -->
  <text x="76" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="84" font-weight="700" fill="#1b1a17" letter-spacing="-2">
    <tspan>The</tspan><tspan dx="22" font-style="italic" fill="#b3361f">Quiet-Broke</tspan><tspan dx="22">Index</tspan>
  </text>

  <!-- subhead -->
  <text x="76" y="260" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#4a4742">How squeezed is a $400K household in your city?</text>

  <!-- divider -->
  <line x1="76" y1="320" x2="1124" y2="320" stroke="#d9d2c6" stroke-width="1" />

  <!-- sample cards label -->
  <text x="76" y="370" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#7a766f" letter-spacing="1.4" font-weight="500">SAMPLE METROS · HIGHER = MORE SQUEEZED</text>

  <!-- four sample cards -->
  
    <rect x="76" y="410" width="240" height="158" rx="8" fill="#fffdf8" stroke="#d9d2c6" stroke-width="1" />
